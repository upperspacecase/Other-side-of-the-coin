<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Other Side of the Coin</title>
<style>
  :root {
    --bg-1: #1a1410;
    --bg-2: #2a1f17;
    --ink: #f5ead6;
    --muted: rgba(245, 234, 214, 0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: "Georgia", "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg-1) 70%);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.6s ease;
    user-select: none;
    -webkit-user-select: none;
    padding: 22px 18px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 19px;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin: 4px 0 2px;
    color: var(--ink);
  }

  .subtitle {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    margin: 0;
  }

  /* ---- Pills ---- */
  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 460px;
    margin: 20px auto 4px;
    min-height: 76px;
    align-content: flex-start;
  }

  .pill {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.2px;
    border: 1px solid currentColor;
    background: rgba(255, 255, 255, 0.04);
    opacity: 0;
    transform: translateY(8px) scale(0.92);
    animation: pillIn 0.42s cubic-bezier(.2,.9,.25,1) forwards;
  }

  @keyframes pillIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---- Coin ---- */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    width: 100%;
    margin: 6px 0;
  }

  .coin {
    position: relative;
    width: 230px;
    height: 230px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(.34,1.3,.5,1);
    transform: rotateY(0deg);
  }

  .coin.flipped { transform: rotateY(180deg); }

  .coin:active { filter: brightness(1.04); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-shadow:
      0 18px 38px rgba(0, 0, 0, 0.55),
      inset 0 0 0 6px rgba(255, 255, 255, 0.18),
      inset 0 0 0 9px rgba(0, 0, 0, 0.16),
      inset 0 14px 30px rgba(255, 255, 255, 0.28),
      inset 0 -16px 34px rgba(0, 0, 0, 0.36);
  }

  /* milled / reeded edge ring */
  .face::before {
    content: "";
    position: absolute;
    inset: 11px;
    border-radius: 50%;
    border: 2px dotted rgba(0, 0, 0, 0.22);
  }

  .face.back { transform: rotateY(180deg); }

  .emotion {
    font-size: 33px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1.05;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 -1px 1px rgba(0,0,0,0.35);
  }

  .body-note {
    margin-top: 12px;
    font-size: 12.5px;
    font-style: italic;
    max-width: 170px;
    opacity: 0.8;
    line-height: 1.35;
  }

  .star {
    font-size: 15px;
    letter-spacing: 6px;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .liberty {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 9.5px;
    letter-spacing: 3px;
    margin-top: 14px;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .tap-hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-family: "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.4px;
    height: 16px;
    margin-bottom: 14px;
    transition: opacity 0.4s ease;
  }

  /* ---- Pair navigation ---- */
  .nav {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .nav button {
    appearance: none;
    border: 1px solid var(--muted);
    background: rgba(255,255,255,0.05);
    color: var(--ink);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .nav button:active { transform: scale(0.9); }

  .pair-label {
    min-width: 168px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .pair-index {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <header>
    <h1>The Other Side of the Coin</h1>
    <p class="subtitle">Same feeling in the body &mdash; flipped in the mind.</p>
  </header>

  <div class="pills" id="pills"></div>

  <div class="stage">
    <div class="coin" id="coin" role="button" tabindex="0" aria-label="Flip the coin">
      <div class="face front" id="faceFront">
        <div class="star">&#9733; &#9733; &#9733;</div>
        <div class="emotion" id="emoFront">EXCITEMENT</div>
        <div class="body-note" id="noteFront"></div>
        <div class="liberty">&starf; Liberty &middot; In Feeling We Trust &starf;</div>
      </div>
      <div class="face back" id="faceBack">
        <div class="star">&#9733; &#9733; &#9733;</div>
        <div class="emotion" id="emoBack">FEAR</div>
        <div class="body-note" id="noteBack"></div>
        <div class="liberty">&starf; Liberty &middot; In Feeling We Trust &starf;</div>
      </div>
    </div>
  </div>

  <div class="tap-hint" id="hint">tap the coin to flip &#8635;</div>

  <div class="nav">
    <button id="prev" aria-label="Previous pair">&#8249;</button>
    <div class="pair-label">
      <span id="pairName">Excitement &amp; Fear</span>
      <span class="pair-index" id="pairIndex">1 / 8</span>
    </div>
    <button id="next" aria-label="Next pair">&#8250;</button>
  </div>

<script>
/* Each pair: two emotions that share the same bodily signature
   (arousal, racing heart, tears, butterflies...) but opposite valence. */
const PAIRS = [
  {
    name: "Excitement & Fear",
    bg: ["#3a2a14", "#1a1208"],
    front: {
      label: "Excitement",
      color: "#ffd27a",
      coin: "linear-gradient(145deg,#ffe7a8,#caa44e 55%,#7c5a1f)",
      note: "racing heart, wide eyes, ready to leap",
      words: ["Thrilled", "Alive", "Eager", "Buzzing", "Pumped", "Electric", "Can't wait"]
    },
    back: {
      label: "Fear",
      color: "#9fb8d6",
      coin: "linear-gradient(145deg,#cfdcef,#8094b0 55%,#3d4a63)",
      note: "racing heart, wide eyes, ready to flee",
      words: ["Terrified", "Dread", "Panic", "Frozen", "Threatened", "Shaky", "On edge"]
    }
  },
  {
    name: "Pleasure & Pain",
    bg: ["#3a1530", "#16070f"],
    front: {
      label: "Pleasure",
      color: "#ffb3d9",
      coin: "linear-gradient(145deg,#ffd9ec,#e487b6 55%,#8c3a64)",
      note: "a flood of intensity you lean into",
      words: ["Bliss", "Delight", "Ecstasy", "Warmth", "Tingling", "Soothing", "Melting"]
    },
    back: {
      label: "Pain",
      color: "#ff9a8a",
      coin: "linear-gradient(145deg,#ffc9bd,#e0705c 55%,#8a2f23)",
      note: "a flood of intensity you pull from",
      words: ["Ache", "Sting", "Agony", "Throb", "Burning", "Sore", "Raw"]
    }
  },
  {
    name: "Anticipation & Anxiety",
    bg: ["#143a2c", "#08160f"],
    front: {
      label: "Anticipation",
      color: "#9ce6c0",
      coin: "linear-gradient(145deg,#c8f3dc,#6cc497 55%,#2c6b4c)",
      note: "leaning toward what's coming",
      words: ["Hopeful", "Eager", "Curious", "Expectant", "Looking forward", "Keen"]
    },
    back: {
      label: "Anxiety",
      color: "#c4b3e6",
      coin: "linear-gradient(145deg,#ddd0f3,#9a86c4 55%,#4d3c6b)",
      note: "bracing against what's coming",
      words: ["Worried", "Tense", "Uneasy", "Restless", "Jittery", "Dreading", "Wired"]
    }
  },
  {
    name: "Love & Anxiety (butterflies)",
    bg: ["#3a1420", "#16070b"],
    front: {
      label: "Love",
      color: "#ff9fb0",
      coin: "linear-gradient(145deg,#ffccd5,#e07d90 55%,#8a3041)",
      note: "butterflies, fluttering chest, can't think straight",
      words: ["Tender", "Devoted", "Smitten", "Warm", "Cherished", "Giddy", "Drawn in"]
    },
    back: {
      label: "Infatuation Dread",
      color: "#b0c4d8",
      coin: "linear-gradient(145deg,#d4e1ef,#869ab5 55%,#3f5066)",
      note: "butterflies, fluttering chest, can't think straight",
      words: ["Nervous", "Insecure", "Clenched", "Guarded", "Spinning", "What if", "Exposed"]
    }
  },
  {
    name: "Joy & Grief (tears)",
    bg: ["#2e2e12", "#121206"],
    front: {
      label: "Joy",
      color: "#ffe27a",
      coin: "linear-gradient(145deg,#fff0b0,#d9bd55 55%,#806f24)",
      note: "tears welling, throat tight, chest full",
      words: ["Elated", "Overjoyed", "Grateful", "Moved", "Radiant", "Overflowing"]
    },
    back: {
      label: "Grief",
      color: "#a9b6c4",
      coin: "linear-gradient(145deg,#d2dce6,#838f9e 55%,#3c454f)",
      note: "tears welling, throat tight, chest hollow",
      words: ["Heartbroken", "Sorrow", "Loss", "Mourning", "Aching", "Tearful"]
    }
  },
  {
    name: "Awe & Dread",
    bg: ["#14213a", "#070c16"],
    front: {
      label: "Awe",
      color: "#9cc8ff",
      coin: "linear-gradient(145deg,#cbe2ff,#6f9ed6 55%,#2f5180)",
      note: "small before something vast, breath held",
      words: ["Wonder", "Amazed", "Humbled", "Inspired", "Breathless", "Reverent"]
    },
    back: {
      label: "Dread",
      color: "#8e9aa8",
      coin: "linear-gradient(145deg,#bcc6d2,#727f8e 55%,#333d48)",
      note: "small before something vast, breath held",
      words: ["Foreboding", "Doom", "Ominous", "Sinking", "Heavy", "Looming"]
    }
  },
  {
    name: "Passion & Anger",
    bg: ["#3a160c", "#160705"],
    front: {
      label: "Passion",
      color: "#ff9d6e",
      coin: "linear-gradient(145deg,#ffcca8,#e08350 55%,#8a3318)",
      note: "heat rising, fists ready, fully ignited",
      words: ["Fervor", "Driven", "Intense", "Burning", "Fired up", "Unstoppable"]
    },
    back: {
      label: "Anger",
      color: "#ff7a6a",
      coin: "linear-gradient(145deg,#ffb3a8,#e05c4a 55%,#8a261b)",
      note: "heat rising, fists ready, fully ignited",
      words: ["Rage", "Fury", "Heated", "Boiling", "Seething", "Furious"]
    }
  },
  {
    name: "Relief & Disappointment",
    bg: ["#14303a", "#071216"],
    front: {
      label: "Relief",
      color: "#9ce0e6",
      coin: "linear-gradient(145deg,#c8f1f3,#6cbfc4 55%,#2c6468)",
      note: "the held breath finally leaves you",
      words: ["Released", "Unburdened", "Lighter", "Calm", "Exhale", "At ease"]
    },
    back: {
      label: "Disappointment",
      color: "#b0a8b8",
      coin: "linear-gradient(145deg,#d6cee0,#897f93 55%,#403a48)",
      note: "the held breath leaks out flat",
      words: ["Letdown", "Deflated", "Hollow", "Sunk", "Crestfallen", "Flat"]
    }
  }
];

let pairIdx = 0;
let showingFront = true;

const coin = document.getElementById("coin");
const pillsEl = document.getElementById("pills");
const hint = document.getElementById("hint");

const emoFront = document.getElementById("emoFront");
const emoBack = document.getElementById("emoBack");
const noteFront = document.getElementById("noteFront");
const noteBack = document.getElementById("noteBack");
const faceFront = document.getElementById("faceFront");
const faceBack = document.getElementById("faceBack");

const pairName = document.getElementById("pairName");
const pairIndexEl = document.getElementById("pairIndex");

function currentSide() {
  const p = PAIRS[pairIdx];
  return showingFront ? p.front : p.back;
}

function renderPills() {
  const side = currentSide();
  pillsEl.innerHTML = "";
  side.words.forEach((w, i) => {
    const el = document.createElement("span");
    el.className = "pill";
    el.textContent = w;
    el.style.color = side.color;
    el.style.animationDelay = (i * 0.05) + "s";
    pillsEl.appendChild(el);
  });
}

function renderFaces() {
  const p = PAIRS[pairIdx];
  emoFront.textContent = p.front.label;
  emoFront.style.color = p.front.color;
  noteFront.textContent = p.front.note;
  faceFront.style.background = p.front.coin;
  faceFront.style.color = p.front.color;

  emoBack.textContent = p.back.label;
  emoBack.style.color = p.back.color;
  noteBack.textContent = p.back.note;
  faceBack.style.background = p.back.coin;
  faceBack.style.color = p.back.color;
}

function renderBg() {
  const [a, b] = PAIRS[pairIdx].bg;
  document.body.style.background =
    "radial-gradient(1200px 800px at 50% -10%, " + a + ", " + b + " 72%)";
}

function renderMeta() {
  pairName.textContent = PAIRS[pairIdx].name;
  pairIndexEl.textContent = (pairIdx + 1) + " / " + PAIRS.length;
}

function renderAll() {
  renderFaces();
  renderBg();
  renderMeta();
  renderPills();
}

let flipping = false;
function flip() {
  if (flipping) return;
  flipping = true;
  showingFront = !showingFront;
  coin.classList.toggle("flipped", !showingFront);
  hint.style.opacity = "0";
  // swap pills at the midpoint of the flip, when the coin is edge-on
  setTimeout(renderPills, 420);
  setTimeout(() => { flipping = false; }, 860);
}

function goToPair(idx) {
  pairIdx = (idx + PAIRS.length) % PAIRS.length;
  showingFront = true;
  coin.classList.remove("flipped");
  renderAll();
}

coin.addEventListener("click", flip);
coin.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
document.getElementById("prev").addEventListener("click", () => goToPair(pairIdx - 1));
document.getElementById("next").addEventListener("click", () => goToPair(pairIdx + 1));

renderAll();
</script>
</body>
</html>
